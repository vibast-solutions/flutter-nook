name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request makes the run in flight pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  engine:
    name: puzzle_engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/puzzle_engine
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      # The uniqueness and determinism tests live here. They are the reason
      # this package is Flutter-free: no device, no emulator, seconds to run.
      - name: Test
        run: dart test

  packs:
    name: bundled packs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/puzzle_engine
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      # Regenerate the committed starter packs from the same engine the app
      # runs, and fail if a single byte differs. This is its own job so a pack
      # change shows up in a diff of its own rather than buried in a feature PR,
      # it proves the packs are exactly what regeneration produces (never
      # hand-edited), and it exercises the CLI so it cannot rot as the engine
      # changes around it.
      - name: Regenerate packs
        run: dart run puzzle_engine:generate --out ../../assets/packs

      - name: Check the committed packs are up to date
        run: |
          if ! git diff --exit-code -- ../../assets/packs; then
            echo "::error::Bundled packs are out of date. Run \
              'dart run puzzle_engine:generate' and commit the result."
            exit 1
          fi

  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
