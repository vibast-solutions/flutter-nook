name: nook
description: "A free puzzle collection. No ads, no tracking, no account."
publish_to: 'none'

# version: <marketing version>+<build number>
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Localisation. Both are first-party (shipped with the SDK / maintained by
  # the Dart team); Nook uses no third-party localisation package.
  flutter_localizations:
    sdk: flutter
  intl: any

  # State. Chosen for being testable without widgets — see the technical design.
  flutter_riverpod: ^3.0.0

  # The rules: solvers and generators, pure Dart and Flutter-free on purpose.
  puzzle_engine:
    path: packages/puzzle_engine

  # Saved games, and later statistics. SQLite because a save is a row and a
  # statistic is a query; Drift because it types the schema and generates the
  # mapping rather than leaving hand-written SQL to drift out of step with it.
  # The native library comes from `sqlite3`'s own build hooks — the old
  # `sqlite3_flutter_libs` is retired and is deliberately not depended on.
  drift: ^2.34.3

  # Where the database file goes on each platform. First-party (flutter.dev).
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates the Drift mapping. Build-time only: nothing here ships in the
  # app, and the generated file is committed so a checkout analyses without a
  # code-generation step.
  drift_dev: ^2.34.5
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  # Turns lib/l10n/*.arb into the AppLocalizations class. See l10n.yaml.
  generate: true

  # Bundled starter packs: a few dozen pre-generated puzzles per game and tier,
  # so the first tap after a cold launch hands back a board instead of a spinner
  # (VIB-78). Regenerated by `dart run puzzle_engine:generate`, never by hand,
  # and a cache rather than content — the app generates on the device when a
  # pack is spent or absent, so an empty directory breaks nothing.
  assets:
    - assets/packs/

  # Bundled rather than fetched: Nook makes no network requests, and a font
  # downloaded on first launch would break that and look wrong offline.
  # Both families are licensed under the SIL Open Font License; the licences
  # are in assets/fonts alongside them. Both are subsets — what each one can
  # actually draw is checked in test/design/font_coverage_test.dart.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
